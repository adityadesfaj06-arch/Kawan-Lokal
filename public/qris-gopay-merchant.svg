<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840" style="background:#00AEEF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cyan Background -->
  <rect width="600" height="840" fill="#00AEEF"/>

  <!-- Top Header Gopay Merchant -->
  <g transform="translate(60, 45)">
    <!-- Gopay Icon -->
    <rect x="0" y="0" width="46" height="42" rx="14" fill="#FFFFFF"/>
    <circle cx="23" cy="21" r="7" fill="#00AEEF"/>
    <!-- Gopay Merchant Text -->
    <text x="60" y="32" fill="#FFFFFF" font-size="36" font-weight="900" letter-spacing="-0.5">gopay<tspan font-weight="400"> merchant</tspan></text>
  </g>

  <!-- Main White Card -->
  <g filter="url(#cardShadow)">
    <rect x="44" y="115" width="512" height="630" rx="36" fill="#FFFFFF"/>
    
    <!-- Red Decorative Corner Triangles -->
    <!-- Top-Left Inner Accent -->
    <polygon points="44,200 44,280 120,200" fill="#E41B26"/>
    <!-- Bottom-Right Inner Accent -->
    <polygon points="556,580 556,660 480,660" fill="#E41B26"/>

    <!-- QRIS Logo Top Left -->
    <g transform="translate(74, 145)">
      <text x="0" y="24" fill="#0C1428" font-size="28" font-weight="900" letter-spacing="1">QRIS</text>
      <text x="75" y="12" fill="#0C1428" font-size="9" font-weight="700">QR Code Standar</text>
      <text x="75" y="23" fill="#0C1428" font-size="9" font-weight="700">Pembayaran Nasional</text>
      <line x1="0" y1="30" x2="65" y2="30" stroke="#E41B26" stroke-width="2.5"/>
    </g>

    <!-- GPN Logo Top Right -->
    <g transform="translate(460, 140)">
      <!-- Stylized Bird Wing -->
      <path d="M 12 18 C 18 10, 32 4, 38 0 C 34 8, 30 16, 26 22 C 34 16, 42 12, 46 8 C 42 16, 36 24, 28 28 C 36 26, 42 26, 44 24 C 36 30, 24 34, 14 30 Z" fill="#E41B26"/>
      <text x="8" y="44" fill="#1B2B65" font-size="14" font-weight="900" letter-spacing="1">GPN</text>
    </g>

    <!-- Merchant Name -->
    <text x="300" y="215" text-anchor="middle" fill="#14181F" font-size="14.5" font-weight="800" letter-spacing="0.2">
      EDGARD FANS SIMAHENDALI, KESEHATAN &amp; OLAHRAGA
    </text>

    <!-- NMID -->
    <text x="300" y="238" text-anchor="middle" fill="#3D4451" font-size="13" font-weight="700" letter-spacing="0.8">
      NMID: ID1026543831071
    </text>

    <!-- Terminal Code -->
    <text x="300" y="266" text-anchor="middle" fill="#14181F" font-size="13" font-weight="800">
      A01
    </text>

    <!-- QR Code Image -->
    <image href="data:image/png;base64," x="120" y="280" width="360" height="360"/>

    <!-- Printed By / Dicetak Oleh -->
    <text x="130" y="660" fill="#2B303A" font-size="12" font-weight="700">
      Dicetak oleh: 93600914
    </text>
  </g>

  <!-- Bottom Bar: Terima Pembayaran QRIS dari mana saja -->
  <g transform="translate(0, 755)">
    <text x="300" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">
      Terima pembayaran QRIS dari mana saja
    </text>
    <g transform="translate(50, 32)">
      <!-- Gopay pill -->
      <rect x="0" y="4" width="70" height="22" rx="5" fill="#FFFFFF"/>
      <text x="35" y="19" text-anchor="middle" fill="#00AEEF" font-size="12" font-weight="900">gopay</text>

      <!-- BCA pill -->
      <rect x="80" y="4" width="55" height="22" rx="5" fill="#003580"/>
      <text x="107" y="19" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">BCA</text>

      <!-- Mandiri pill -->
      <rect x="145" y="4" width="70" height="22" rx="5" fill="#0B3C73"/>
      <text x="180" y="19" text-anchor="middle" fill="#FDB813" font-size="12" font-weight="800">mandiri</text>

      <!-- BNI pill -->
      <rect x="225" y="4" width="50" height="22" rx="5" fill="#F15A24"/>
      <text x="250" y="19" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">BNI</text>

      <!-- BRI pill -->
      <rect x="285" y="4" width="75" height="22" rx="5" fill="#00529C"/>
      <text x="322" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">BANK BRI</text>

      <!-- dan bank lainnya -->
      <text x="370" y="20" fill="#FFFFFF" font-size="12" font-weight="600">dan bank lainnya</text>
    </g>
  </g>
</svg>